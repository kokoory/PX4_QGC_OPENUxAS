<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QGC Cesium 3D View</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Cesium.js"></script>
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.125/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }
        .cesium-viewer-toolbar,
        .cesium-viewer-animationContainer,
        .cesium-viewer-timelineContainer,
        .cesium-viewer-fullscreenContainer,
        .cesium-viewer-bottom {
            display: none !important;
        }
        /* OpenUxAS area-search planning panel (in-page, draws over the globe) */
        #uxasPanel {
            position: absolute; top: 50px; right: 12px; width: 250px;
            background: rgba(24,28,34,0.90); color: #e8e8e8;
            font: 12px/1.4 sans-serif; border: 1px solid #5a6472;
            border-radius: 6px; padding: 8px 10px; z-index: 1000;
            user-select: none;
        }
        #uxasPanel h3 { margin: 0 0 6px 0; font-size: 13px; display: flex;
            justify-content: space-between; align-items: center; cursor: move; }
        #uxasPanel .row { display: flex; justify-content: space-between;
            align-items: center; margin: 3px 0; }
        #uxasPanel label { color: #b8c0cc; }
        #uxasPanel input, #uxasPanel select {
            width: 110px; background: #11151b; color: #e8e8e8;
            border: 1px solid #3a4150; border-radius: 3px; padding: 2px 4px;
            font-size: 12px;
        }
        #uxasPanel .calc { margin: 6px 0; padding: 5px 0;
            border-top: 1px solid #3a4150; border-bottom: 1px solid #3a4150; }
        #uxasPanel .need { font-weight: bold; color: #ffd24a; }
        #uxasPanel button {
            margin: 2px 0; padding: 4px 6px; width: 100%; cursor: pointer;
            background: #2d4a6b; color: #fff; border: 1px solid #3a5a82;
            border-radius: 3px; font-size: 12px;
        }
        #uxasPanel button.go { background: #2f7d4f; border-color: #3a9a60; }
        #uxasPanel button:hover { filter: brightness(1.15); }
        #uxasPanel .hint { color: #8aa; font-size: 11px; margin-top: 4px; }
        #uxasPanel.collapsed .body { display: none; }
        #uxasToggle { cursor: pointer; padding: 0 6px; }
        /* tabs */
        #uxasTabs { display: flex; margin: 0 0 6px 0; gap: 2px; }
        #uxasTabs .tab { flex: 1; text-align: center; padding: 4px 0;
            background: #1b2026; border: 1px solid #3a4150; border-radius: 3px;
            cursor: pointer; color: #b8c0cc; }
        #uxasTabs .tab.active { background: #2d4a6b; color: #fff; border-color: #3a5a82; }
        .tabBody { display: none; } .tabBody.active { display: block; }
        /* feature checklist */
        #uxList { max-height: 150px; overflow-y: auto; margin: 4px 0;
            border: 1px solid #3a4150; border-radius: 3px; padding: 3px; }
        #uxList .item { display: flex; align-items: center; gap: 5px;
            padding: 1px 2px; cursor: pointer; }
        #uxList .item:hover { background: #222a33; }
        #uxList .item input { width: auto; }
        #uxList .item .cnt { color: #8aa; margin-left: auto; font-size: 11px; }
        .miniBtns { display: flex; gap: 4px; }
        .miniBtns button { width: auto; flex: 1; }
        .veh { display: flex; gap: 6px; align-items: center; }
        .veh input { width: 46px; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>

    <div id="uxasPanel">
        <h3>UxAS Search Planner <span id="uxasToggle">–</span></h3>
        <div class="body">
            <div id="uxasTabs">
                <div class="tab active" data-tab="area">Area</div>
                <div class="tab" data-tab="road">Road</div>
                <div class="tab" data-tab="river">River</div>
            </div>

            <!-- shared: fleet + altitude -->
            <div class="row"><label>X500</label>
                <span class="veh"><input id="uxNX500" type="number" value="1" min="0" max="5">
                <label>Cessna</label><input id="uxNCessna" type="number" value="0" min="0" max="1"></span></div>
            <div class="row"><label>Vehicle IDs</label>
                <input id="uxVeh" type="text" value="1"></div>
            <div class="row"><label>Altitude (m)</label>
                <input id="uxAlt" type="number" value="150" min="20" step="10"></div>

            <!-- AREA -->
            <div class="tabBody active" id="tab-area">
                <div class="row"><label>Shape</label>
                    <select id="uxShape">
                        <option value="rect">Rectangle</option>
                        <option value="poly">Polygon (draw)</option>
                    </select></div>
                <div id="uxRectRows">
                    <div class="row"><label>Width (m)</label>
                        <input id="uxW" type="number" value="2000" min="50" step="100"></div>
                    <div class="row"><label>Height (m)</label>
                        <input id="uxH" type="number" value="2000" min="50" step="100"></div>
                </div>
                <div id="uxPolyRows" style="display:none">
                    <div class="miniBtns">
                        <button id="uxDraw">Draw: click map</button>
                        <button id="uxPolyClear">Clear</button>
                    </div>
                    <div class="hint" id="uxPolyInfo">0 points</div>
                </div>
                <div class="row"><label>Sensor</label>
                    <select id="uxMode">
                        <option value="wide">Wide (45°)</option>
                        <option value="detail">Detail (20°)</option>
                    </select></div>
                <div class="calc" id="uxCalc">–</div>
                <button id="uxSetN">Set vehicles to need</button>
                <button class="go" id="uxGoArea">Publish Area Search</button>
                <div class="hint">Rectangle/polygon centred on the view; Preview before publish.</div>
            </div>

            <!-- ROAD / RIVER share the same list UI -->
            <div class="tabBody" id="tab-road">
                <button id="uxScanRoad">Scan area for roads</button>
                <div class="miniBtns">
                    <button id="uxRoadAll">Select all</button>
                    <button id="uxRoadNone">Clear</button>
                </div>
                <div id="uxListRoadWrap"><div id="uxListRoad" class="uxFeatList"></div></div>
                <div class="hint">Check names, or click roads on the map to toggle.</div>
                <button class="go" id="uxGoRoad">Publish Road Search</button>
            </div>
            <div class="tabBody" id="tab-river">
                <button id="uxScanRiver">Scan area for rivers</button>
                <div class="miniBtns">
                    <button id="uxRiverAll">Select all</button>
                    <button id="uxRiverNone">Clear</button>
                </div>
                <div id="uxListRiverWrap"><div id="uxListRiver" class="uxFeatList"></div></div>
                <div class="hint">Check names, or click rivers on the map to toggle.</div>
                <button class="go" id="uxGoRiver">Publish River Search</button>
            </div>
        </div>
    </div>
    <script>
    "use strict";

    let viewer = null;
    let vehicleEntities = {};
    let vehicleShadows = {};
    let vehicleLabels = {};
    let vehicleLines = {};
    let trajectoryEntity = null;
    let missionPolyline = null;
    let missionWaypoints = [];
    let homeEntity = null;
    let homeShadow = null;
    let gotoEntity = null;
    let gotoRingEntity = null;

    let qgcBridge = null;
    let _bridgeReady = false;
    let _cesiumInitialized = false;

    document.addEventListener("DOMContentLoaded", function () {
        if (typeof QWebChannel !== "undefined" && typeof qt !== "undefined") {
            new QWebChannel(qt.webChannelTransport, function (channel) {
                qgcBridge = channel.objects.qgcBridge;
                _bridgeReady = true;
                if (_cesiumInitialized && qgcBridge) {
                    qgcBridge.cesiumReady();
                }
            });
        }
    });

    // QGC vehicle arrow icon
    function createVehicleIcon() {
        var size = 64;
        var canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        var ctx = canvas.getContext("2d");
        var s = size / 72;
        ctx.beginPath();
        ctx.moveTo(35.5*s, 2.118*s); ctx.lineTo(35.5*s, 53.691*s); ctx.lineTo(1.118*s, 70.882*s);
        ctx.closePath(); ctx.fillStyle = "#c72b27"; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(36.5*s, 2.118*s); ctx.lineTo(36.5*s, 53.691*s); ctx.lineTo(70.882*s, 70.882*s);
        ctx.closePath(); ctx.fillStyle = "#ee3424"; ctx.fill();
        ctx.beginPath();
        ctx.moveTo(36*s, 0); ctx.lineTo(0, 72*s); ctx.lineTo(36*s, 54*s); ctx.lineTo(72*s, 72*s);
        ctx.closePath(); ctx.strokeStyle = "#7f0036"; ctx.lineWidth = 1.5; ctx.stroke();
        return canvas.toDataURL("image/png");
    }

    var VEHICLE_ICON = null;

    // VWorld (브이월드) covers only Korea. Restrict tile requests to this
    // box so Cesium doesn't spam 404s elsewhere and falls through to the
    // base world imagery outside Korea.
    var VWORLD_RECT = Cesium.Rectangle.fromDegrees(123.0, 32.0, 132.5, 39.5);

    function addVWorldLayers(token) {
        // Korean high-res satellite, draped over the globe + world terrain.
        // WMTS path /{z}/{y}/{x}, Web Mercator, XYZ (top-left) tile numbering
        // — matches Cesium's default WebMercatorTilingScheme.
        viewer.imageryLayers.addImageryProvider(
            new Cesium.UrlTemplateImageryProvider({
                url: "https://api.vworld.kr/req/wmts/1.0.0/" + token +
                     "/Satellite/{z}/{y}/{x}.jpeg",
                tilingScheme: new Cesium.WebMercatorTilingScheme(),
                minimumLevel: 5, maximumLevel: 19,
                rectangle: VWORLD_RECT,
                credit: "VWorld",
            }));
        // Hybrid overlay: roads, place labels, admin boundaries (transparent png).
        viewer.imageryLayers.addImageryProvider(
            new Cesium.UrlTemplateImageryProvider({
                url: "https://api.vworld.kr/req/wmts/1.0.0/" + token +
                     "/Hybrid/{z}/{y}/{x}.png",
                tilingScheme: new Cesium.WebMercatorTilingScheme(),
                minimumLevel: 5, maximumLevel: 19,
                rectangle: VWORLD_RECT,
            }));
    }

    // ===============================================================
    // VWorld 3D buildings: fetch building footprints (LT_C_SPBD) for the
    // current view from the VWorld Data API and extrude them by floor count
    // (gro_flo_co). Loaded on camera-idle when zoomed in close enough.
    // ===============================================================
    var VWORLD_TOKEN = "";
    var buildingEntities = [];
    var roadEntities = [];
    var riverEntities = [];
    var _bldgLoadTimer = null;
    var _bldgLastKey = "";
    var FLOOR_HEIGHT_M = 3.3;            // meters per above-ground floor
    var BLDG_MAX_VIEW_HEIGHT = 14000;   // only fetch when camera below this (m)

    function _clearEntities(list) {
        list.forEach(function (e) { viewer.entities.remove(e); });
        list.length = 0;
    }
    function _clearVWorldBuildings() { _clearEntities(buildingEntities); }
    function _clearVWorldVectors() {
        _clearEntities(buildingEntities);
        _clearEntities(roadEntities);
        _clearEntities(riverEntities);
    }

    // Ask QML to fetch buildings for the current view. The VWorld Data API
    // sends no Access-Control-Allow-Origin header, so a fetch() from this
    // qrc: page is blocked by CORS. QML's XMLHttpRequest is not subject to
    // CORS, so the QML side does the request and calls renderVWorldBuildings().
    function loadVWorldBuildings() {
        if (!VWORLD_TOKEN || !viewer || !qgcBridge) return;
        var camHeight = viewer.camera.positionCartographic.height;
        if (camHeight > BLDG_MAX_VIEW_HEIGHT) { _clearVWorldVectors(); return; }

        // Use the point the camera is actually looking at (screen centre ray
        // hitting the globe), not computeViewRectangle — a pitched camera's
        // view rectangle balloons to the horizon, producing a huge geomFilter
        // BOX that VWorld rejects (returns 0 features).
        var canvas = viewer.scene.canvas;
        var centerPx = new Cesium.Cartesian2(canvas.clientWidth / 2, canvas.clientHeight / 2);
        var ray = viewer.camera.getPickRay(centerPx);
        var hit = ray ? viewer.scene.globe.pick(ray, viewer.scene) : null;
        var carto = hit ? Cesium.Cartographic.fromCartesian(hit)
                        : viewer.camera.positionCartographic;
        var clat = Cesium.Math.toDegrees(carto.latitude);
        var clon = Cesium.Math.toDegrees(carto.longitude);

        // Box scales with altitude but must stay under VWorld's 10 km²
        // geomFilter limit. At lat ~37.5 a 0.014° half-margin (0.028° side)
        // is ~7.6 km² — safely under the cap; bigger boxes return an error
        // (INVALID_RANGE) and hence zero buildings.
        var margin = Math.max(0.004, Math.min(camHeight * 0.000006, 0.014));
        var w = clon - margin, e = clon + margin, s = clat - margin, n = clat + margin;
        if (e < 123 || w > 132.5 || n < 32 || s > 39.5) { _clearVWorldVectors(); return; }

        var key = [w.toFixed(3), s.toFixed(3), e.toFixed(3), n.toFixed(3)].join(",");
        if (key === _bldgLastKey) return;
        _bldgLastKey = key;

        // Buildings (extruded) + roads + rivers, all from the same view box.
        qgcBridge.requestVWorldLayer("LT_C_SPBD", w, s, e, n, "renderVWorldBuildings");
        qgcBridge.requestVWorldLayer("LT_L_MOCTLINK", w, s, e, n, "renderVWorldRoads");
        qgcBridge.requestVWorldLayer("LT_C_WKMSTRM", w, s, e, n, "renderVWorldRivers");
    }

    // Roads (LT_L_MOCTLINK, MultiLineString) → yellow polylines on the ground.
    function renderVWorldRoads(featuresJson) {
        if (!viewer) return;
        var feats;
        try { feats = JSON.parse(featuresJson); } catch (e) { feats = []; }
        _clearEntities(roadEntities);
        feats.forEach(function (f) {
            var g = f.geometry;
            var lines = (g.type === "MultiLineString") ? g.coordinates
                      : (g.type === "LineString") ? [g.coordinates] : [];
            lines.forEach(function (ln) {
                var flat = [];
                ln.forEach(function (c) { flat.push(c[0], c[1]); });
                if (flat.length < 4) return;
                var ent = viewer.entities.add({
                    polyline: {
                        positions: Cesium.Cartesian3.fromDegreesArray(flat),
                        width: 3,
                        clampToGround: true,
                        material: Cesium.Color.fromCssColorString("#ffcc00").withAlpha(0.9),
                    },
                });
                roadEntities.push(ent);
            });
        });
    }

    // Rivers (LT_C_WKMSTRM, MultiPolygon) → translucent blue surfaces.
    function renderVWorldRivers(featuresJson) {
        if (!viewer) return;
        var feats;
        try { feats = JSON.parse(featuresJson); } catch (e) { feats = []; }
        _clearEntities(riverEntities);
        feats.forEach(function (f) {
            var g = f.geometry;
            var polys = (g.type === "MultiPolygon") ? g.coordinates
                      : (g.type === "Polygon") ? [g.coordinates] : [];
            polys.forEach(function (poly) {
                var ring = poly[0];
                var flat = [];
                ring.forEach(function (c) { flat.push(c[0], c[1]); });
                if (flat.length < 6) return;
                var ent = viewer.entities.add({
                    polygon: {
                        hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
                        material: Cesium.Color.fromCssColorString("#2a7fff").withAlpha(0.45),
                        classificationType: Cesium.ClassificationType.TERRAIN,
                    },
                });
                riverEntities.push(ent);
            });
        });
    }

    // Called by QML with the VWorld GetFeature JSON (string).
    function renderVWorldBuildings(featuresJson) {
        if (!viewer) return;
        var feats;
        try { feats = JSON.parse(featuresJson); } catch (e) { feats = []; }

        // Collect each building's outer ring + floor count, plus one sample
        // point for terrain height. Extruded polygons IGNORE heightReference,
        // so to make a building sit ON the ground (not at absolute height 0,
        // where Seoul's ~30 m terrain + depth testing buries it) we sample the
        // terrain height at the building and set absolute base/top heights.
        var builds = [];
        var samplePts = [];
        feats.forEach(function (f) {
            var floors = parseInt(f.properties.gro_flo_co, 10);
            if (!floors || floors < 1) floors = 1;
            var geom = f.geometry;
            var polys = (geom.type === "MultiPolygon") ? geom.coordinates
                      : (geom.type === "Polygon") ? [geom.coordinates] : [];
            polys.forEach(function (poly) {
                var ring = poly[0];   // outer ring
                if (!ring || ring.length < 3) return;
                var flat = [];
                ring.forEach(function (c) { flat.push(c[0], c[1]); });
                builds.push({ flat: flat, bldgHeight: floors * FLOOR_HEIGHT_M,
                              sampleIdx: samplePts.length });
                samplePts.push(Cesium.Cartographic.fromDegrees(ring[0][0], ring[0][1]));
            });
        });

        var addAll = function (groundHeights) {
            _clearVWorldBuildings();
            builds.forEach(function (b) {
                var base = groundHeights ? groundHeights[b.sampleIdx] : 0;
                var ent = viewer.entities.add({
                    polygon: {
                        hierarchy: Cesium.Cartesian3.fromDegreesArray(b.flat),
                        height: base,                         // base on the terrain
                        extrudedHeight: base + b.bldgHeight,  // roof
                        material: Cesium.Color.fromCssColorString("#d9d0c3").withAlpha(0.95),
                        outline: true,
                        outlineColor: Cesium.Color.fromCssColorString("#6b6256"),
                        closeTop: true, closeBottom: true,
                    },
                });
                buildingEntities.push(ent);
            });
        };

        // Sample terrain for all buildings in one batch, then build them.
        if (samplePts.length && viewer.terrainProvider) {
            Cesium.sampleTerrainMostDetailed(viewer.terrainProvider, samplePts)
                .then(function (updated) {
                    addAll(updated.map(function (c) { return c.height || 0; }));
                })
                .catch(function () { addAll(null); });
        } else {
            addAll(null);
        }
    }

    function _scheduleBuildingLoad() {
        if (_bldgLoadTimer) clearTimeout(_bldgLoadTimer);
        _bldgLoadTimer = setTimeout(loadVWorldBuildings, 400);
    }

    // centerLon/centerLat/centerHeight describe the QGC 2D map's current
    // view, so the 3D view opens looking at the same place.
    function initCesium(token, vworldToken, centerLon, centerLat, centerHeight) {
        Cesium.Ion.defaultAccessToken = token;
        viewer = new Cesium.Viewer("cesiumContainer", {
            terrain: Cesium.Terrain.fromWorldTerrain(),
            animation: false, timeline: false, fullscreenButton: false,
            vrButton: false, geocoder: false, homeButton: false,
            infoBox: false, sceneModePicker: false, selectionIndicator: false,
            navigationHelpButton: false, baseLayerPicker: false,
            creditContainer: document.createElement("div"),
        });
        viewer.scene.globe.depthTestAgainstTerrain = true;
        VEHICLE_ICON = createVehicleIcon();

        if (vworldToken && vworldToken.length > 0) {
            VWORLD_TOKEN = vworldToken;
            addVWorldLayers(vworldToken);
            // Load/refresh extruded 3D buildings whenever the camera settles.
            viewer.camera.moveEnd.addEventListener(_scheduleBuildingLoad);
        }

        // Open on the same spot the 2D map is showing (fallback: Korea).
        var lon = (typeof centerLon === "number" && isFinite(centerLon)) ? centerLon : 127.206028;
        var lat = (typeof centerLat === "number" && isFinite(centerLat)) ? centerLat : 34.61167;
        var h = (typeof centerHeight === "number" && isFinite(centerHeight) && centerHeight > 0) ? centerHeight : 3000;
        viewer.camera.setView({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, h),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-55), roll: 0 },
        });

        // Right-click → QML
        viewer.screenSpaceEventHandler.setInputAction(function (click) {
            var ray = viewer.camera.getPickRay(click.position);
            var cartesian = viewer.scene.globe.pick(ray, viewer.scene);
            if (!cartesian) return;
            var carto = Cesium.Cartographic.fromCartesian(cartesian);
            if (qgcBridge) {
                qgcBridge.mapClicked(
                    Cesium.Math.toDegrees(carto.latitude),
                    Cesium.Math.toDegrees(carto.longitude),
                    carto.height,
                    click.position.x, click.position.y
                );
            }
        }, Cesium.ScreenSpaceEventType.RIGHT_CLICK);

        // Initial building load (setView doesn't fire camera.moveEnd).
        if (VWORLD_TOKEN) _scheduleBuildingLoad();

        // Map left-click handler for polygon draw + road/river select.
        // Must be installed here (viewer now exists), NOT in _uxInitPanel
        // which runs on DOMContentLoaded before initCesium.
        if (typeof _uxInstallMapPick === "function") _uxInstallMapPick();

        _cesiumInitialized = true;
        if (_bridgeReady && qgcBridge) qgcBridge.cesiumReady();
    }

    // ===============================================================
    // Vehicle: billboard with heightReference: RELATIVE_TO_GROUND
    //   + ground shadow ellipse (CLAMP_TO_GROUND, heading-oriented)
    //   + vertical altitude line
    // NO alignedAxis, NO disableDepthTestDistance
    // ===============================================================
    function updateVehiclePosition(vehicleId, lat, lon, alt, heading) {
        if (!viewer) return;
        heading = heading || 0;
        var position = Cesium.Cartesian3.fromDegrees(lon, lat, alt);


        var groundPos = Cesium.Cartesian3.fromDegrees(lon, lat, 0);
        var rotRad = Cesium.Math.toRadians(heading);
        var hpr = new Cesium.HeadingPitchRoll(rotRad, 0, 0);
        var orient = Cesium.Transforms.headingPitchRollQuaternion(groundPos, hpr);

        if (vehicleEntities[vehicleId]) {
            vehicleEntities[vehicleId].position = position;
            vehicleEntities[vehicleId].billboard.rotation = -rotRad;
            if (vehicleShadows[vehicleId]) {
                vehicleShadows[vehicleId].position = groundPos;
                vehicleShadows[vehicleId].orientation = orient;
            }
            if (vehicleLabels[vehicleId]) {
                vehicleLabels[vehicleId].position = position;
            }
            if (vehicleLines[vehicleId]) {
                vehicleLines[vehicleId].polyline.positions = [groundPos, position];
            }
        } else {
            // Billboard: heightReference does the terrain math for us
            vehicleEntities[vehicleId] = viewer.entities.add({
                id: "vehicle_" + vehicleId,
                position: position,
                billboard: {
                    image: VEHICLE_ICON,
                    width: 48, height: 48,
                    rotation: -rotRad,
                    verticalOrigin: Cesium.VerticalOrigin.CENTER,
                    horizontalOrigin: Cesium.HorizontalOrigin.CENTER,
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                },
            });

            vehicleLabels[vehicleId] = viewer.entities.add({
                id: "vehicle_label_" + vehicleId,
                position: position,
                label: {
                    text: "UAV " + vehicleId,
                    font: "13px bold sans-serif",
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -30),
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    showBackground: true,
                    backgroundColor: Cesium.Color.fromAlpha(Cesium.Color.fromCssColorString("#e74c3c"), 0.8),
                    backgroundPadding: new Cesium.Cartesian2(6, 4),
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                },
            });

            // Vertical line: ground → vehicle (altitude indicator in 3D)
            vehicleLines[vehicleId] = viewer.entities.add({
                id: "vehicle_line_" + vehicleId,
                polyline: {
                    positions: [groundPos, position],
                    width: 1,
                    material: Cesium.Color.WHITE.withAlpha(0.4),
                    clampToGround: false,
                },
            });

            // Ground shadow: heading ellipse (this reliably works with CLAMP_TO_GROUND)
            vehicleShadows[vehicleId] = viewer.entities.add({
                id: "vehicle_shadow_" + vehicleId,
                position: groundPos,
                orientation: orient,
                ellipse: {
                    semiMajorAxis: 4, semiMinorAxis: 2.5,
                    material: Cesium.Color.RED.withAlpha(0.35),
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
            });
        }
    }

    // ===============================================================
    // Camera
    // ===============================================================
    function flyToVehicle(vehicleId) {
        if (!viewer || !vehicleEntities[vehicleId]) return;
        var pos = vehicleEntities[vehicleId].position.getValue(viewer.clock.currentTime);
        if (!pos) return;
        var carto = Cesium.Cartographic.fromCartesian(pos);
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(Cesium.Math.toDegrees(carto.longitude), Cesium.Math.toDegrees(carto.latitude), 500),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
            duration: 1.5,
        });
    }

    function flyToLocation(lat, lon, alt) {
        if (!viewer) return;
        viewer.camera.flyTo({
            destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt || 1000),
            orientation: { heading: 0, pitch: Cesium.Math.toRadians(-45), roll: 0 },
            duration: 1.5,
        });
    }

    // ===============================================================
    // Trajectory
    // ===============================================================
    var trajectoryPositions = [];
    function addTrajectoryPoint(lat, lon, alt) {
        if (!viewer) return;
        trajectoryPositions.push(Cesium.Cartesian3.fromDegrees(lon, lat, alt));
        if (!trajectoryEntity) {
            trajectoryEntity = viewer.entities.add({
                id: "trajectory",
                polyline: {
                    positions: new Cesium.CallbackProperty(function() { return trajectoryPositions; }, false),
                    width: 3,
                    material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.2, color: Cesium.Color.RED }),
                },
            });
        }
    }
    function clearTrajectory() {
        trajectoryPositions = [];
        if (trajectoryEntity) { viewer.entities.remove(trajectoryEntity); trajectoryEntity = null; }
    }

    // ===============================================================
    // Mission items: point + label with RELATIVE_TO_GROUND
    // ===============================================================
    function setMissionItems(itemsJson) {
        if (!viewer) return;
        missionWaypoints.forEach(function(e) { viewer.entities.remove(e); });
        missionWaypoints = [];
        if (missionPolyline) { viewer.entities.remove(missionPolyline); missionPolyline = null; }

        var items = JSON.parse(itemsJson);
        if (!items || items.length === 0) return;
        var positions = [];

        items.forEach(function(item, idx) {
            var pos = Cesium.Cartesian3.fromDegrees(item.lon, item.lat, item.alt || 0);
            positions.push(pos);
            var isCurrent = item.current || false;
            var isFirst = (idx === 0);
            var color = isFirst ? Cesium.Color.GREEN : isCurrent ? Cesium.Color.ORANGE : Cesium.Color.DODGERBLUE;

            var wp = viewer.entities.add({
                id: "wp_" + item.seq,
                position: pos,
                point: {
                    pixelSize: isCurrent ? 16 : 12,
                    color: color,
                    outlineColor: Cesium.Color.WHITE,
                    outlineWidth: 2,
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                },
                label: {
                    text: String(item.seq),
                    font: "14px bold sans-serif",
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE,
                    outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -16),
                    fillColor: Cesium.Color.WHITE,
                    outlineColor: Cesium.Color.BLACK,
                    showBackground: true,
                    backgroundColor: Cesium.Color.fromAlpha(Cesium.Color.BLACK, 0.5),
                    heightReference: Cesium.HeightReference.RELATIVE_TO_GROUND,
                },
            });
            missionWaypoints.push(wp);
        });

        if (positions.length > 1) {
            missionPolyline = viewer.entities.add({
                id: "mission_path",
                polyline: { positions: positions, width: 3,
                    material: new Cesium.PolylineGlowMaterialProperty({ glowPower: 0.15, color: Cesium.Color.DODGERBLUE }),
                },
            });
        }
    }

    // ===============================================================
    // Home: point + label with CLAMP_TO_GROUND + ring ellipse
    // ===============================================================
    function setHomePosition(lat, lon, alt) {
        if (!viewer) return;
        var pos = Cesium.Cartesian3.fromDegrees(lon, lat, 0);
        if (homeEntity) {
            homeEntity.position = pos;
            if (homeShadow) homeShadow.position = pos;
        } else {
            homeShadow = viewer.entities.add({
                id: "home_ring", position: pos,
                ellipse: {
                    semiMajorAxis: 5, semiMinorAxis: 5,
                    material: Cesium.Color.LIME.withAlpha(0.25),
                    outline: true, outlineColor: Cesium.Color.LIME, outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
            });
            homeEntity = viewer.entities.add({
                id: "home", position: pos,
                point: {
                    pixelSize: 14, color: Cesium.Color.LIME,
                    outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
                label: {
                    text: "H", font: "14px bold sans-serif",
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -16),
                    fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK,
                    showBackground: true,
                    backgroundColor: Cesium.Color.fromAlpha(Cesium.Color.BLACK, 0.6),
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
            });
        }
    }

    // ===============================================================
    // Go-to indicator: ring + point + label (all CLAMP_TO_GROUND)
    // ===============================================================
    function showGotoIndicator(lat, lon, alt) {
        if (!viewer) return;
        var pos = Cesium.Cartesian3.fromDegrees(lon, lat, 0);
        if (gotoEntity) {
            gotoEntity.position = pos; gotoEntity.show = true;
            if (gotoRingEntity) { gotoRingEntity.position = pos; gotoRingEntity.show = true; }
        } else {
            gotoRingEntity = viewer.entities.add({
                id: "goto_ring", position: pos,
                ellipse: {
                    semiMajorAxis: 8, semiMinorAxis: 8,
                    material: Cesium.Color.YELLOW.withAlpha(0.25),
                    outline: true, outlineColor: Cesium.Color.YELLOW, outlineWidth: 3,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
            });
            gotoEntity = viewer.entities.add({
                id: "goto_indicator", position: pos,
                point: {
                    pixelSize: 14, color: Cesium.Color.YELLOW,
                    outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
                label: {
                    text: "Go Here", font: "13px bold sans-serif",
                    style: Cesium.LabelStyle.FILL_AND_OUTLINE, outlineWidth: 2,
                    verticalOrigin: Cesium.VerticalOrigin.BOTTOM,
                    pixelOffset: new Cesium.Cartesian2(0, -18),
                    fillColor: Cesium.Color.YELLOW, outlineColor: Cesium.Color.BLACK,
                    showBackground: true,
                    backgroundColor: Cesium.Color.fromAlpha(Cesium.Color.BLACK, 0.7),
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                },
            });
        }
    }
    function hideGotoIndicator() {
        if (gotoEntity) gotoEntity.show = false;
        if (gotoRingEntity) gotoRingEntity.show = false;
    }

    // ===============================================================
    // Remove vehicle
    // ===============================================================
    function removeVehicle(vehicleId) {
        if (!viewer) return;
        [vehicleEntities, vehicleLabels, vehicleShadows, vehicleLines].forEach(function(map) {
            if (map[vehicleId]) { viewer.entities.remove(map[vehicleId]); delete map[vehicleId]; }
        });
    }

    // ===============================================================
    // OpenUxAS search planner (in-page; renders over the globe)
    //   Tabs Area / Road / River; mixed X500+Cessna fleet; polygon draw;
    //   road/river scan -> name checklist + map-click select + preview.
    // ===============================================================
    var X500_IDS = [1, 2, 3, 8, 9];     // multicopter pool (vehicles.json)
    var CESSNA_IDS = [4];               // fixed-wing pool
    var uxTab = "area";

    // Area preview + drawn polygon
    var areaPreviewEntity = null;
    var drawnPoly = [];                 // [[lon,lat], ...]
    var drawnPolyEntity = null;
    var drawing = false;

    // Scanned road/river features: name -> {pts:[[lat,lon]...], entity, selected}
    var featData = { road: {}, river: {} };
    var scanBox = null;                 // {clat, clon, half} of the last scan

    function _uxEl(id) { return document.getElementById(id); }

    // ---- fleet -----------------------------------------------------
    function _uxVehicleIds() {
        var nx = Math.min(X500_IDS.length, Math.max(0, parseInt(_uxEl("uxNX500").value) || 0));
        var nc = Math.min(CESSNA_IDS.length, Math.max(0, parseInt(_uxEl("uxNCessna").value) || 0));
        var ids = X500_IDS.slice(0, nx).concat(CESSNA_IDS.slice(0, nc));
        return ids;
    }
    function _uxSyncVehicles() {
        var ids = _uxVehicleIds();
        _uxEl("uxVeh").value = ids.join(",") || "1";
    }

    // ---- coverage (Area tab) ---------------------------------------
    function _uxCoverage() {
        var alt = parseFloat(_uxEl("uxAlt").value) || 100;
        var detail = _uxEl("uxMode").value === "detail";
        var hfov = detail ? 20 : 45, overlap = detail ? 0.25 : 0.20;
        var speed = detail ? 10 : 12, eff = 0.75, onSta = 22 * 60;
        var swath = 2 * alt * Math.tan(hfov * Math.PI / 360);
        var perDrone = swath * (1 - overlap) * speed * eff * onSta;
        var area = _uxAreaM2();
        return { areaKm2: area / 1e6, gsdCm: (swath / 1024) * 100,
                 perDroneKm2: perDrone / 1e6,
                 drones: Math.max(1, Math.ceil(area / Math.max(1, perDrone))) };
    }
    function _uxAreaM2() {
        if (_uxEl("uxShape").value === "poly" && drawnPoly.length >= 3) {
            // shoelace in metres (approx)
            var lat0 = drawnPoly[0][1];
            var mPerLon = 111320 * Math.cos(lat0 * Math.PI / 180), mPerLat = 111320;
            var s = 0;
            for (var i = 0; i < drawnPoly.length; i++) {
                var a = drawnPoly[i], b = drawnPoly[(i + 1) % drawnPoly.length];
                s += (a[0] * mPerLon) * (b[1] * mPerLat) - (b[0] * mPerLon) * (a[1] * mPerLat);
            }
            return Math.abs(s) / 2;
        }
        var w = parseFloat(_uxEl("uxW").value) || 0, h = parseFloat(_uxEl("uxH").value) || 0;
        return w * h;
    }
    function _uxRefreshCalc() {
        var c = _uxCoverage();
        _uxEl("uxCalc").innerHTML =
            "Area <b>" + c.areaKm2.toFixed(2) + " km²</b> · GSD " + c.gsdCm.toFixed(0) + " cm<br>"
          + "1 X500 ≈ " + c.perDroneKm2.toFixed(2) + " km² → "
          + "<span class='need'>need " + c.drones + " X500</span>";
        _uxEl("uxSetN").textContent = "Set vehicles to " + c.drones;
    }

    // ---- geometry helpers ------------------------------------------
    function _uxViewCentre() {
        if (!viewer) return null;
        var cv = viewer.scene.canvas;
        var px = new Cesium.Cartesian2(cv.clientWidth / 2, cv.clientHeight / 2);
        var ray = viewer.camera.getPickRay(px);
        var hit = ray ? viewer.scene.globe.pick(ray, viewer.scene) : null;
        var carto = hit ? Cesium.Cartographic.fromCartesian(hit) : viewer.camera.positionCartographic;
        return { lat: Cesium.Math.toDegrees(carto.latitude), lon: Cesium.Math.toDegrees(carto.longitude) };
    }
    function _uxRectCorners(lat, lon, w, h) {
        var dLat = (h / 2) / 111320.0, dLon = (w / 2) / (111320.0 * Math.cos(lat * Math.PI / 180));
        return [[lat - dLat, lon - dLon], [lat - dLat, lon + dLon],
                [lat + dLat, lon + dLon], [lat + dLat, lon - dLon]];
    }

    // ---- AREA preview + publish ------------------------------------
    function _uxClearAreaPreview() {
        if (areaPreviewEntity) { viewer.entities.remove(areaPreviewEntity); areaPreviewEntity = null; }
    }
    function _uxAreaPolygonLatLon() {
        if (_uxEl("uxShape").value === "poly") {
            if (drawnPoly.length < 3) return null;
            return drawnPoly.map(function (c) { return [c[1], c[0]]; });   // [lat,lon]
        }
        var c = _uxViewCentre(); if (!c) return null;
        var w = parseFloat(_uxEl("uxW").value) || 1000, h = parseFloat(_uxEl("uxH").value) || 1000;
        return _uxRectCorners(c.lat, c.lon, w, h);
    }
    function _uxPreviewArea() {
        var poly = _uxAreaPolygonLatLon(); if (!poly) return;
        _uxClearAreaPreview();
        var flat = []; poly.forEach(function (p) { flat.push(p[1], p[0]); });
        areaPreviewEntity = viewer.entities.add({ polygon: {
            hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
            material: Cesium.Color.YELLOW.withAlpha(0.20),
            outline: true, outlineColor: Cesium.Color.YELLOW,
            classificationType: Cesium.ClassificationType.TERRAIN } });
        _uxSyncOverlay();
        return poly;
    }
    function _uxPublishArea() {
        if (!qgcBridge) return;
        var poly = _uxPreviewArea(); if (!poly) { return; }
        // centre = polygon centroid (just for the operating region)
        var clat = 0, clon = 0; poly.forEach(function (p) { clat += p[0]; clon += p[1]; });
        clat /= poly.length; clon /= poly.length;
        qgcBridge.publishSearch("area", clat, clon, JSON.stringify({
            polygon: poly, vehicles: _uxEl("uxVeh").value || "1",
            altitude: parseFloat(_uxEl("uxAlt").value) || 100,
            region_radius: 4000 }));
    }

    // ---- polygon drawing -------------------------------------------
    var drawnVertexEntities = [];
    function _uxRedrawDrawnPoly() {
        if (drawnPolyEntity) { viewer.entities.remove(drawnPolyEntity); drawnPolyEntity = null; }
        drawnVertexEntities.forEach(function (e) { viewer.entities.remove(e); });
        drawnVertexEntities = [];
        _uxEl("uxPolyInfo").textContent = drawnPoly.length + " points (click map to add)";
        if (drawnPoly.length < 1) return;
        // a visible dot on every vertex (so the very first click shows)
        drawnPoly.forEach(function (c) {
            drawnVertexEntities.push(viewer.entities.add({
                position: Cesium.Cartesian3.fromDegrees(c[0], c[1]),
                point: { pixelSize: 10, color: Cesium.Color.CYAN,
                    outlineColor: Cesium.Color.WHITE, outlineWidth: 2,
                    heightReference: Cesium.HeightReference.CLAMP_TO_GROUND,
                    disableDepthTestDistance: Number.POSITIVE_INFINITY } }));
        });
        if (drawnPoly.length >= 2) {
            var flat = []; drawnPoly.forEach(function (c) { flat.push(c[0], c[1]); });
            drawnPolyEntity = viewer.entities.add(drawnPoly.length >= 3 ? { polygon: {
                hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
                material: Cesium.Color.CYAN.withAlpha(0.18),
                outline: true, outlineColor: Cesium.Color.CYAN,
                classificationType: Cesium.ClassificationType.TERRAIN } }
              : { polyline: { positions: Cesium.Cartesian3.fromDegreesArray(flat),
                width: 3, material: Cesium.Color.CYAN, clampToGround: true } });
        }
        _uxRefreshCalc();
    }

    // ---- ROAD/RIVER scan, checklist, map-select --------------------
    // The scan covers the AREA you selected on the Area tab (drawn polygon or
    // the W×H rectangle), clamped to VWorld's 10 km² geomFilter limit. If you
    // haven't sized an area, it falls back to a 2 km box at the view centre.
    var VWORLD_MAX_KM2 = 9.0;
    function _uxScanBbox() {
        var poly = _uxAreaPolygonLatLon();   // [[lat,lon]...] of the selected area
        var w, s, e, n;
        if (poly && poly.length >= 2) {
            s = Math.min.apply(null, poly.map(function (p) { return p[0]; }));
            n = Math.max.apply(null, poly.map(function (p) { return p[0]; }));
            w = Math.min.apply(null, poly.map(function (p) { return p[1]; }));
            e = Math.max.apply(null, poly.map(function (p) { return p[1]; }));
        } else {
            var c = _uxViewCentre(); if (!c) return null;
            var d = 1000 / 111320;
            s = c.lat - d; n = c.lat + d; w = c.lon - d / Math.cos(c.lat * Math.PI / 180);
            e = c.lon + d / Math.cos(c.lat * Math.PI / 180);
        }
        // Clamp to <=VWORLD_MAX_KM2 around the centroid (VWorld rejects bigger).
        var clat = (s + n) / 2, clon = (w + e) / 2;
        var hM = (n - s) * 111320, wM = (e - w) * 111320 * Math.cos(clat * Math.PI / 180);
        var areaKm2 = (hM * wM) / 1e6, clamped = false;
        if (areaKm2 > VWORLD_MAX_KM2) {
            var k = Math.sqrt(VWORLD_MAX_KM2 / areaKm2);
            hM *= k; wM *= k; clamped = true;
            var dLat = (hM / 2) / 111320, dLon = (wM / 2) / (111320 * Math.cos(clat * Math.PI / 180));
            s = clat - dLat; n = clat + dLat; w = clon - dLon; e = clon + dLon;
        }
        return { w: w, s: s, e: e, n: n, clat: clat, clon: clon, clamped: clamped };
    }
    function _uxScan(kind) {
        if (!qgcBridge) return;
        var bb = _uxScanBbox(); if (!bb) return;
        scanBox = bb;
        var info = _uxEl(kind === "road" ? "uxListRoad" : "uxListRiver");
        info.innerHTML = "<div class='hint'>scanning"
            + (bb.clamped ? " (area clamped to 9 km² VWorld limit)" : "") + "…</div>";
        var layer = (kind === "road") ? "LT_L_MOCTLINK" : "LT_C_WKMSTRM";
        var cb = (kind === "road") ? "renderRoadScan" : "renderRiverScan";
        qgcBridge.requestVWorldLayer(layer, bb.w, bb.s, bb.e, bb.n, cb);
    }
    function _uxClipLine(ln, b) {   // b = {w,s,e,n}
        return ln.filter(function (c) { return c[0] >= b.w && c[0] <= b.e && c[1] >= b.s && c[1] <= b.n; });
    }
    function _uxGroupFeatures(kind, featuresJson) {
        var feats; try { feats = JSON.parse(featuresJson); } catch (e) { feats = []; }
        var b = scanBox ? { w: scanBox.w, e: scanBox.e, s: scanBox.s, n: scanBox.n } : null;
        var groups = {};   // name -> [ [lon,lat]... ] merged points (for preview)
        feats.forEach(function (f) {
            var nm = ((kind === "road" ? f.properties.road_name : f.properties.riv_nm) || "").trim();
            if (!nm) return;
            var g = f.geometry;
            if (kind === "road") {
                var lines = (g.type === "MultiLineString") ? g.coordinates
                          : (g.type === "LineString") ? [g.coordinates] : [];
                lines.forEach(function (ln) {
                    var cl = b ? _uxClipLine(ln, b) : ln;
                    if (cl.length >= 2) (groups[nm] = groups[nm] || []).push(cl);
                });
            } else {
                var polys = (g.type === "MultiPolygon") ? g.coordinates
                          : (g.type === "Polygon") ? [g.coordinates] : [];
                polys.forEach(function (p) { (groups[nm] = groups[nm] || []).push(p[0]); });
            }
        });
        return groups;
    }
    function _uxRenderScan(kind, featuresJson) {
        var groups = _uxGroupFeatures(kind, featuresJson);
        // clear previous feature entities of this kind
        Object.keys(featData[kind]).forEach(function (nm) {
            var e = featData[kind][nm].entity;
            if (e) e.forEach(function (x) { viewer.entities.remove(x); });
        });
        featData[kind] = {};
        var listEl = _uxEl(kind === "road" ? "uxListRoad" : "uxListRiver");
        listEl.innerHTML = "";
        var names = Object.keys(groups).sort();
        names.forEach(function (nm) {
            var ents = [];
            var color = (kind === "road") ? Cesium.Color.ORANGE : Cesium.Color.DODGERBLUE;
            groups[nm].forEach(function (seg) {
                var flat = []; seg.forEach(function (c) { flat.push(c[0], c[1]); });
                if (kind === "road") {
                    ents.push(viewer.entities.add({ name: kind + ":" + nm, polyline: {
                        positions: Cesium.Cartesian3.fromDegreesArray(flat), width: 4,
                        material: color.withAlpha(0.55), clampToGround: true } }));
                } else {
                    ents.push(viewer.entities.add({ name: kind + ":" + nm, polygon: {
                        hierarchy: Cesium.Cartesian3.fromDegreesArray(flat),
                        material: color.withAlpha(0.30),
                        classificationType: Cesium.ClassificationType.TERRAIN } }));
                }
            });
            featData[kind][nm] = { entity: ents, selected: false, segs: groups[nm] };
            // checklist row
            var seg = groups[nm].length;
            var item = document.createElement("label"); item.className = "item";
            item.innerHTML = "<input type='checkbox' data-kind='" + kind + "' data-name='"
                + nm.replace(/'/g, "") + "'> <span>" + nm + "</span><span class='cnt'>" + seg + "</span>";
            listEl.appendChild(item);
            item.querySelector("input").addEventListener("change", function (ev) {
                _uxSetSelected(kind, nm, ev.target.checked);
            });
        });
        if (!names.length) listEl.innerHTML = "<div class='hint'>none found in view</div>";
    }
    function renderRoadScan(j) { _uxRenderScan("road", j); }
    function renderRiverScan(j) { _uxRenderScan("river", j); }

    function _uxSetSelected(kind, nm, on) {
        var f = featData[kind][nm]; if (!f) return;
        f.selected = on;
        var base = (kind === "road") ? Cesium.Color.ORANGE : Cesium.Color.DODGERBLUE;
        var col = on ? Cesium.Color.LIME : base;
        f.entity.forEach(function (e) {
            if (e.polyline) e.polyline.material = col.withAlpha(on ? 0.95 : 0.55);
            if (e.polygon) e.polygon.material = col.withAlpha(on ? 0.45 : 0.30);
        });
        // sync the checkbox
        var cb = document.querySelector("input[data-kind='" + kind + "'][data-name='" + nm.replace(/'/g, "") + "']");
        if (cb) cb.checked = on;
        _uxSyncOverlay();
    }
    function _uxSelectAll(kind, on) {
        Object.keys(featData[kind]).forEach(function (nm) { _uxSetSelected(kind, nm, on); });
    }
    function _uxSelectedNames(kind) {
        return Object.keys(featData[kind]).filter(function (nm) { return featData[kind][nm].selected; });
    }

    // Mirror the current plan (area polygon + selected roads/rivers) to the
    // 2D flight map via EventBroadcaster.planOverlay.
    function _uxSyncOverlay() {
        if (!qgcBridge) return;
        var o = { area: null, roads: [], rivers: [] };
        if (uxTab === "area") o.area = _uxAreaPolygonLatLon();   // [[lat,lon]...]
        ["road", "river"].forEach(function (kind) {
            Object.keys(featData[kind]).forEach(function (nm) {
                if (!featData[kind][nm].selected) return;
                (featData[kind][nm].segs || []).forEach(function (seg) {
                    o[kind + "s"].push(seg.map(function (c) { return [c[1], c[0]]; }));
                });
            });
        });
        qgcBridge.setPlanOverlay(JSON.stringify(o));
    }
    function _uxPublishFeatures(kind) {
        if (!qgcBridge || !scanBox) return;
        var sel = _uxSelectedNames(kind);
        var names = sel.length ? sel.join(",") : "ALL";
        var spanM = Math.max((scanBox.n - scanBox.s) * 111320,
                             (scanBox.e - scanBox.w) * 111320);
        qgcBridge.publishSearch(kind, scanBox.clat, scanBox.clon, JSON.stringify({
            names: names,
            bbox: [scanBox.w, scanBox.s, scanBox.e, scanBox.n],   // exact scan area
            vehicles: _uxEl("uxVeh").value || "1",
            altitude: parseFloat(_uxEl("uxAlt").value) || 120,
            region_radius: Math.max(3000, spanM) }));
    }

    // map left-click: toggle the road/river under the cursor (by name)
    function _uxInstallMapPick() {
        if (!viewer) return;
        viewer.screenSpaceEventHandler.setInputAction(function (click) {
            if (drawing) {   // polygon drawing mode consumes the click
                var ray = viewer.camera.getPickRay(click.position);
                var cart = ray ? viewer.scene.globe.pick(ray, viewer.scene) : null;
                if (cart) {
                    var ca = Cesium.Cartographic.fromCartesian(cart);
                    drawnPoly.push([Cesium.Math.toDegrees(ca.longitude), Cesium.Math.toDegrees(ca.latitude)]);
                    _uxRedrawDrawnPoly();
                }
                return;
            }
            var picked = viewer.scene.pick(click.position);
            if (picked && picked.id && picked.id.name && picked.id.name.indexOf(":") > 0) {
                var parts = picked.id.name.split(":");
                var kind = parts[0], nm = parts.slice(1).join(":");
                if (featData[kind] && featData[kind][nm])
                    _uxSetSelected(kind, nm, !featData[kind][nm].selected);
            }
        }, Cesium.ScreenSpaceEventType.LEFT_CLICK);
    }

    // ---- panel wiring ----------------------------------------------
    function _uxSwitchTab(t) {
        uxTab = t;
        ["area", "road", "river"].forEach(function (k) {
            _uxEl("tab-" + k).classList.toggle("active", k === t);
        });
        var tabs = document.querySelectorAll("#uxasTabs .tab");
        tabs.forEach(function (el) { el.classList.toggle("active", el.getAttribute("data-tab") === t); });
        if (t === "area") _uxPreviewArea(); else _uxSyncOverlay();
    }

    function _uxInitPanel() {
        ["uxNX500", "uxNCessna"].forEach(function (id) {
            _uxEl(id).addEventListener("input", _uxSyncVehicles);
        });
        ["uxAlt", "uxMode", "uxW", "uxH"].forEach(function (id) {
            _uxEl(id).addEventListener("input", function () { _uxRefreshCalc(); if (uxTab === "area") _uxPreviewArea(); });
        });
        _uxEl("uxShape").addEventListener("change", function () {
            var poly = _uxEl("uxShape").value === "poly";
            _uxEl("uxRectRows").style.display = poly ? "none" : "block";
            _uxEl("uxPolyRows").style.display = poly ? "block" : "none";
            _uxRefreshCalc(); _uxPreviewArea();
        });
        _uxEl("uxDraw").addEventListener("click", function () {
            drawing = !drawing;
            _uxEl("uxDraw").textContent = drawing ? "Drawing… (click Finish)" : "Draw: click map";
            if (!drawing) { _uxClearAreaPreview(); _uxPreviewArea(); }
        });
        _uxEl("uxPolyClear").addEventListener("click", function () {
            drawnPoly = []; _uxRedrawDrawnPoly(); _uxClearAreaPreview();
        });
        _uxEl("uxSetN").addEventListener("click", function () {
            var n = _uxCoverage().drones; _uxEl("uxNX500").value = Math.min(X500_IDS.length, n); _uxSyncVehicles();
        });
        _uxEl("uxGoArea").addEventListener("click", function () { _uxPublishArea(); });
        _uxEl("uxScanRoad").addEventListener("click", function () { _uxScan("road"); });
        _uxEl("uxScanRiver").addEventListener("click", function () { _uxScan("river"); });
        _uxEl("uxRoadAll").addEventListener("click", function () { _uxSelectAll("road", true); });
        _uxEl("uxRoadNone").addEventListener("click", function () { _uxSelectAll("road", false); });
        _uxEl("uxRiverAll").addEventListener("click", function () { _uxSelectAll("river", true); });
        _uxEl("uxRiverNone").addEventListener("click", function () { _uxSelectAll("river", false); });
        _uxEl("uxGoRoad").addEventListener("click", function () { _uxPublishFeatures("road"); });
        _uxEl("uxGoRiver").addEventListener("click", function () { _uxPublishFeatures("river"); });
        document.querySelectorAll("#uxasTabs .tab").forEach(function (el) {
            el.addEventListener("click", function () { _uxSwitchTab(el.getAttribute("data-tab")); });
        });
        _uxEl("uxasToggle").addEventListener("click", function (ev) {
            ev.stopPropagation();
            var p = _uxEl("uxasPanel"); p.classList.toggle("collapsed");
            _uxEl("uxasToggle").textContent = p.classList.contains("collapsed") ? "+" : "–";
        });
        _uxMakeDraggable();
        // _uxInstallMapPick() is called from initCesium (viewer must exist).
        _uxSyncVehicles();
        _uxRefreshCalc();
    }

    function _uxMakeDraggable() {
        var panel = _uxEl("uxasPanel"), header = panel.querySelector("h3");
        var dragging = false, ox = 0, oy = 0;
        header.addEventListener("mousedown", function (ev) {
            dragging = true;
            var r = panel.getBoundingClientRect(); ox = ev.clientX - r.left; oy = ev.clientY - r.top;
            panel.style.right = "auto"; ev.preventDefault();
        });
        window.addEventListener("mousemove", function (ev) {
            if (!dragging) return;
            panel.style.left = Math.max(0, Math.min(window.innerWidth - 40, ev.clientX - ox)) + "px";
            panel.style.top = Math.max(0, Math.min(window.innerHeight - 20, ev.clientY - oy)) + "px";
        });
        window.addEventListener("mouseup", function () { dragging = false; });
    }
    document.addEventListener("DOMContentLoaded", _uxInitPanel);
    </script>
</body>
</html>
